<text x="610" y="130" class="body">ONE-LANE FIRST PLAYABLE</text>
<text x="610" y="155" class="small">Red: hostile route x=60, z=-70 to -22 (48m).</text>
<text x="610" y="176" class="small">Bridge deck z=-71.5 to -35.5; 6m clear.</text>
<text x="610" y="197" class="small">Gate is open; barricade at z=-20.5 is objective.</text>
<text x="610" y="218" class="small">Defeat 24 raiders; breach is loss.</text>
<text x="610" y="239" class="small">Existing loop was smoke-tested on legacy r10.</text>
<text x="610" y="260" class="small">New geometry invalidates inherited clearance claims.</text>
<text x="610" y="315" class="body">PROTECTED PLAYER ROUTE</text>
<text x="610" y="340" class="small">Cyan: spawn → west apron → 35 risers × .18m</text>
<text x="610" y="361" class="small">→ wallwalk y=6.3 → existing station operator.</text>
<text x="610" y="382" class="small">West stair 2.4m tread width / .30m going.</text>
<text x="610" y="403" class="small">Purple B3: proposed two-flight upper ascent.</text>
<text x="610" y="424" class="small">Portals 1.8m clear; melee / TPS not validated.</text>
<text x="610" y="470" class="body">COVERAGE / OPERATOR SPACE</text>
<text x="610" y="495" class="small">Gold wedge: illustrative; actual arc/range needs LOS.</text>
<text x="610" y="516" class="small">Purple station box: proposed 2×2m operator/reload</text>
<text x="610" y="537" class="small">reservation at current marker; fit NOT established.</text>
<text x="610" y="558" class="small">Reserve ≥2.2m weapon lateral room separately.</text>
<text x="610" y="579" class="small">Camera-only mount smoke does not prove body fit.</text>
<text x="610" y="600" class="small">No automatic station spawning or forced actor offset.</text>
<text x="610" y="645" class="body">PREPARATION + REPAIR CHOICE</text>
<text x="610" y="670" class="small">Current small loop: 6 supplies; heavy bolt costs 2;</text>
<text x="610" y="691" class="small">repair costs 3 and restores 75 barricade health.</text>
<text x="610" y="712" class="small">Prepare/deploy crews and between-wave resupply</text>
<text x="610" y="733" class="small">are proposed extensions, with costs untuned.</text>
<text x="610" y="754" class="small">Reserve the courtyard for movement and fighting;</text>
<text x="610" y="775" class="small">supplies/dressing stay outside travel and aim lanes.</text>
<text x="32" y="915" class="small">Measured coordinate source: staged site-plan.json + slice-candidate.json. Geometry and coverage remain proposals.</text>
