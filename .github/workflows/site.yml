name: Site

# Builds the scene shelf from the committed site/ and the bundled examples,
# then deploys exactly the checked folder to Cloudflare Pages: a preview for each
# PR branch in this repository, and production after approval in GitHub.
# See docs/distribution.md.

on:
  pull_request:
    paths:
      - site/**
      - examples/**
      - src/**
      - server/**
      - bin/**
      - scripts/build-site.mjs
      - scripts/render-site.mjs
      - scripts/deploy-site.mjs
      - deploy/**
      - package.json
      - package-lock.json
      - vite.config.js
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - examples/**
      - src/**
      - server/**
      - bin/**
      - scripts/build-site.mjs
      - scripts/render-site.mjs
      - scripts/deploy-site.mjs
      - deploy/**
      - package.json
      - package-lock.json
      - vite.config.js
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node scripts/build-site.mjs --out "$RUNNER_TEMP/site"
      # The full preflight, without Wrangler or secrets; it records the folder's sha256.
      - id: check
        run: node scripts/deploy-site.mjs --project-name holodeck --site-dir "$RUNNER_TEMP/site" --dry-run --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 7

  preview:
    needs: build
    # Never for forks: a Pages token cannot be limited to one project or to previews.
    # SITE_DEPLOY is a repository variable, set to enabled once both environments exist.
    if: vars.SITE_DEPLOY == 'enabled' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: site-preview
      url: https://pr-${{ github.event.pull_request.number }}.holodeck-5mm.pages.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/package-lock.json
      - run: npm ci
      # Wrangler and its dependencies, exactly as locked; no install scripts run.
      - run: npm ci --prefix deploy --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: ${{ runner.temp }}/site
      - run: node scripts/deploy-site.mjs --project-name holodeck --site-dir "$RUNNER_TEMP/site" --expect-sha256 "$SITE_SHA256" --preview --branch "pr-$PR_NUMBER"
        env:
          SITE_SHA256: ${{ needs.build.outputs.sha256 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    needs: build
    if: vars.SITE_DEPLOY == 'enabled' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment's required reviewer approves each production deploy.
    environment:
      name: site-production
      url: https://holodeck.kilnstudio.tools/
    concurrency:
      group: site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/package-lock.json
      - run: npm ci
      # Wrangler and its dependencies, exactly as locked; no install scripts run.
      - run: npm ci --prefix deploy --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: ${{ runner.temp }}/site
      - run: node scripts/deploy-site.mjs --project-name holodeck --site-dir "$RUNNER_TEMP/site" --expect-sha256 "$SITE_SHA256" --branch main
        env:
          SITE_SHA256: ${{ needs.build.outputs.sha256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
